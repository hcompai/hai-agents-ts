name: Test

on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # 20 is the floor package.json declares (engines); 22 the current LTS.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test


      - name: Build
        run: pnpm -r run build
