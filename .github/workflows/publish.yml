name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  api-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prod serves every operation the SDK calls; the pinned runtime accepts its session fields
        run: node scripts/release.mjs check --runtime-pin packages/sdk/src/local/pin.json

  # As the Python SDK's publish: the pinned hai-agent-runtime downloads, verifies and serves the shared recipe.
  runtime-pin:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter hai-agents run build
      - name: Pinned runtime downloads, verifies and serves the shared recipe
        working-directory: packages/sdk
        env:
          HAI_AGENT_RUNTIME_FAKE: "1"
        run: |
          node --input-type=module -e '
          import { mkdtempSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { LocalRuntime } from "hai-agents/local";
          const runtime = await LocalRuntime.ensureStarted({
            download: true,
            requiredRecipe: "shared",
            cacheDir: mkdtempSync(join(tmpdir(), "runtime-pin-")),
            port: 18799,
            env: { HAI_AGENT_RUNTIME_RECIPE: "shared" },
          });
          await runtime.shutdown();
          '

  publish:
    needs: [api-compat, runtime-pin]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Build
        run: pnpm --filter hai-agents run build
      - name: Assert tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/sdk
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        working-directory: packages/sdk
        run: npm publish --dry-run
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        working-directory: packages/sdk
        run: npm publish --access public

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: "hai-agents ${{ github.ref_name }}"
